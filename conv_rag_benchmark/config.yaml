# conv_rag_benchmark configuration.
# Every key here is optional; CLI flags and environment variables override it.
# (Requires PyYAML; if absent these defaults are simply skipped.)

# --- models ---------------------------------------------------------------
gen_model: gpt-4o-mini      # generates questions / gold answers / mock-RAG answers
judge_model: gpt-4o         # LLM-as-a-judge failure classifier (kept separate)
embed_model: text-embedding-3-small

# --- dataset --------------------------------------------------------------
dataset: synthetic          # multihoprag | hotpotqa | 2wikimultihopqa | musique | synthetic
dataset_path: null          # override the dataset directory/path
max_samples: 20

# --- conversation generation ---------------------------------------------
num_conversations: 5
min_turns: 3
max_turns: 6

# --- target system under test --------------------------------------------
target_rag: mock            # mock | vector | graph

# --- runtime --------------------------------------------------------------
seed: 42
prefer_local_embeddings: true   # try sentence-transformers before OpenAI
offline: false                  # set true to force no-network heuristics
